apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: i15-1-plot-frames
  labels:
    workflows.diamond.ac.uk/science-group-crystallography: "true"
  annotations:
    workflows.argoproj.io/title: plot_frames
    workflows.argoproj.io/description: |
      This takes a nxs filenumber and a dataset path, sums and normalises the frames,
      and plots them. The plots are saved to disk alongside the raw data, and a
      combined preview image is published as a workflow artifact.
    workflows.diamond.ac.uk/repository: "https://github.com/DiamondLightSource/XRPD-Toolbox"
spec:
  entrypoint: workflow-entry
  arguments:
    parameters:
      - name: filenumber
        value: 12345
      - name: dataset_path
        value: /entry/pe2AD/data
      - name: visitdir
        valueFrom:
          configMapKeyRef:
            name: sessionspaces
            key: data_directory
  volumes:
  - name: session
    hostPath:
      path: "{{`{{ workflow.parameters.visitdir }}`}}"
      type: Directory
  volumeClaimTemplates:
  - metadata:
      name: tmpdir
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
      storageClassName: netapp
  templates:
    - name: i15-1-plot-frames
      inputs:
        parameters:
          - name: filenumber
          - name: dataset_path
      script:
        image: ghcr.io/diamondlightsource/xrpd-toolbox:latest
        volumeMounts:
        - name: tmpdir
          mountPath: /tmp
        - name: session
          mountPath: "{{`{{ workflow.parameters.visitdir }}`}}"
        command: ["python"]
        env:
          - name: MKL_NUM_THREADS
            value: "1"
          - name: NUMEXPR_NUM_THREADS
            value: "1"
          - name: OMP_NUM_THREADS
            value: "1"
        source: |

          import math
          import os

          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt

          from xrpd_toolbox.i15_1.eiger_500k import EigerDataLoader
          from xrpd_toolbox.utils.utils import wait_for_finished_file

          filenumber_str = "{{`{{ inputs.parameters.filenumber }}`}}"

          beamline = "i15-1"
          filename = f"{beamline}-{filenumber_str}.nxs"
          visit_dir = "{{`{{ workflow.parameters.visitdir }}`}}"
          dataset_path = "{{`{{ inputs.parameters.dataset_path }}`}}"
          filepath = os.path.join(visit_dir, filename)

          wait_for_finished_file(filepath)

          eiger_data = EigerDataLoader(filepath)
          frames = eiger_data.get_summed_and_normalised_frames()
          n_frames = len(frames)
          print(f"Got {n_frames} frame(s) from {filepath}")

          # save each frame individually alongside the raw data, as before
          for n, frame in enumerate(frames):
              output_filename = f"{beamline}-{filenumber_str}_{n}.png"
              save_filepath = os.path.join(visit_dir, output_filename)
              plt.figure()
              plt.imshow(frame)
              plt.colorbar()
              plt.title(output_filename)
              plt.savefig(save_filepath)
              plt.close()
              print(f"Saved frame {n} to {save_filepath}")

          # also build a single combined figure so the plots can be
          # previewed directly as a workflow artifact, without needing to
          # download and open each individual frame
          n_cols = min(4, n_frames) or 1
          n_rows = math.ceil(n_frames / n_cols) or 1
          fig, axes = plt.subplots(
              n_rows, n_cols, figsize=(4 * n_cols, 4 * n_rows), squeeze=False
          )
          for n, frame in enumerate(frames):
              ax = axes[n // n_cols][n % n_cols]
              im = ax.imshow(frame)
              ax.set_title(f"frame {n}")
              fig.colorbar(im, ax=ax)
          for n in range(n_frames, n_rows * n_cols):
              axes[n // n_cols][n % n_cols].axis("off")

          fig.suptitle(filename)
          fig.tight_layout()

          artifact_path = "/tmp/plot_frames.png"
          fig.savefig(artifact_path)
          print(f"Saved combined preview to {artifact_path}")

      outputs:
        artifacts:
          - name: plot-frames
            path: /tmp/plot_frames.png
            archive:
              none: {}

      podSpecPatch: |
        containers:
        - name: main
          resources:
            requests:
              cpu: "1"
              memory: 10Gi
            limits:
              cpu: "1"
              memory: 20Gi

    - name: workflow-entry
      dag:
        tasks:
        - name: i15-1-plot-frames
          template: i15-1-plot-frames
          dependencies: []
          arguments:
            parameters:
            - name: filenumber
              value: "{{`{{workflow.parameters.filenumber}}`}}"
            - name: dataset_path
              value: "{{`{{workflow.parameters.dataset_path}}`}}"
