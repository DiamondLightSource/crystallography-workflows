apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: plot_frames
  labels:
    workflows.diamond.ac.uk/science-group-crystallography: "true"
  annotations:
    workflows.argoproj.io/title: plot_frames
    workflows.argoproj.io/description: |
      This takes a nxs filnumber and a datset path, and sums the data, fits the data and returns the sample alignment centre. Results are published to rabbitmq and saved to disk
    workflows.diamond.ac.uk/repository: "https://github.com/DiamondLightSource/XRPD-Toolbox"
spec:
  entrypoint: workflow-entry
  arguments:
    parameters:
      - name: filenumber
        value: 12345
      - name: dataset_path
        value: /entry/pe2AD/data
      - name: visitdir
        valueFrom:
          configMapKeyRef:
            name: sessionspaces
            key: data_directory
  volumes:
  - name: session
    hostPath:
      path: "{{`{{ workflow.parameters.visitdir }}`}}"
      type: Directory
  volumeClaimTemplates:
  - metadata:
      name: tmpdir
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
      storageClassName: netapp
  templates:
    - name: plot_frames
      inputs:
        parameters:
          - name: filenumber
          - name: dataset_path
      script:
        image: ghcr.io/diamondlightsource/xrpd-toolbox:latest
        volumeMounts:
        - name: tmpdir
          mountPath: /tmp
        - name: session
          mountPath: "{{`{{ workflow.parameters.visitdir }}`}}"
        command: ["python"]
        env:
          - name: MKL_NUM_THREADS
            value: "1"
          - name: NUMEXPR_NUM_THREADS
            value: "1"
          - name: OMP_NUM_THREADS
            value: "1"
        source: |

          import os
          import time
          from xrpd_toolbox.i15_1.eiger_500k import EigerDataLoader
          from xrpd_toolbox.utils.utils import wait_for_finished_file
          import matplotlib.pyplot as plt
          import numpy as np

          filenumber_int = int("{{`{{ inputs.parameters.filenumber }}`}}")
          filenumber_str = str("{{`{{ inputs.parameters.filenumber }}`}}")

          beamline = "i15-1"
          filename = beamline + "-" + filenumber_str + ".nxs"
          visit_dir = "{{`{{ workflow.parameters.visitdir }}`}}"
          dataset_path = "{{`{{ workflow.parameters.dataset_path }}`}}"
          filepath = os.path.join(visit_dir, filename)

          wait_for_finished_file(filepath)

          eiger_data = EigerDataLoader(filepath)

          frames = eiger_data.get_summed_and_normalised_frames()

          for n,frame in enumerate(frames):

              output_filename = beamline + "-" + filenumber_str + "_" + str(n) +.png

              save_filepath = os.path.join(visit_dir, output_filename)
              plt.imshow(frame)
              plt.savefig(save_filepath)


      podSpecPatch: |
        containers:
        - name: main
          resources:
            requests:
              cpu: "1"
              memory: 10Gi
            limits:
              cpu: "1"
              memory: 20Gi

    - name: workflow-entry
      dag:
        tasks:
        - name: plot_frames
          template: plot_frames
          dependencies: []
          arguments:
            parameters:
            - name: filenumber
              value: "{{`{{workflow.parameters.filenumber}}`}}"
            - name: dataset_path
              value: "{{`{{workflow.parameters.dataset_path}}`}}"