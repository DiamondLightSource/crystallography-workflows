apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: i15-1-plot-frames
  labels:
    workflows.diamond.ac.uk/science-group-crystallography: "true"
  annotations:
    workflows.argoproj.io/title: i15-1-plot-frames
    workflows.argoproj.io/description: |
      This takes a nxs filenumber, sums and normalises the frames, and plots
      each one. Every plot is saved to disk alongside the raw data, and
      published as its own individual workflow artifact.
    workflows.diamond.ac.uk/repository: "https://github.com/DiamondLightSource/XRPD-Toolbox"
spec:
  entrypoint: workflow-entry
  arguments:
    parameters:
      - name: filenumber
        value: "12345"
      - name: visitdir
        valueFrom:
          configMapKeyRef:
            name: sessionspaces
            key: data_directory
  volumes:
  - name: session
    hostPath:
      path: "{{`{{ workflow.parameters.visitdir }}`}}"
      type: Directory
  volumeClaimTemplates:
  - metadata:
      name: tmpdir
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
      storageClassName: netapp
  templates:
    - name: sum-and-save-frames
      inputs:
        parameters:
          - name: filenumber
      script:
        image: ghcr.io/diamondlightsource/xrpd-toolbox:latest
        volumeMounts:
        - name: tmpdir
          mountPath: /tmp
        - name: session
          mountPath: "{{`{{ workflow.parameters.visitdir }}`}}"
        command: ["python"]
        env:
          - name: MKL_NUM_THREADS
            value: "1"
          - name: NUMEXPR_NUM_THREADS
            value: "1"
          - name: OMP_NUM_THREADS
            value: "1"
        source: |

          import json
          import os

          import numpy as np

          from xrpd_toolbox.i15_1.eiger_500k import EigerDataLoader
          from xrpd_toolbox.utils.utils import wait_for_finished_file

          filenumber_str = "{{`{{ inputs.parameters.filenumber }}`}}"

          beamline = "i15-1"
          filename = f"{beamline}-{filenumber_str}.nxs"
          visit_dir = "{{`{{ workflow.parameters.visitdir }}`}}"
          filepath = os.path.join(visit_dir, filename)

          wait_for_finished_file(filepath)

          eiger_data = EigerDataLoader(filepath)
          mask = eiger_data.get_mask(as_nan=True)

          frames = eiger_data.get_summed_and_normalised_frames()
          tth_positions = eiger_data.get_unique_tth_positions()
          n_frames = len(frames)
          print(f"Got {n_frames} frame(s) from {filepath}")

          # stash the raw frames on the shared tmp volume so that a separate
          # plot-frame task can be fanned out per frame, each producing its
          # own individual artifact
          frame_dir = "/tmp/frames"
          os.makedirs(frame_dir, exist_ok=True)
          for n, frame in enumerate(frames):
              frame = frame * mask
              np.save(os.path.join(frame_dir, f"frame_{n}.npy"), frame)

          frame_items = [
              {"index": n, "tth": float(tth)}
              for n, tth in enumerate(tth_positions)
          ]
          with open("/tmp/frame-indices.json", "w") as f:
              json.dump(frame_items, f)

      outputs:
        parameters:
          - name: frame-indices
            valueFrom:
              path: /tmp/frame-indices.json

      podSpecPatch: |
        containers:
        - name: main
          resources:
            requests:
              cpu: "1"
              memory: 10Gi
            limits:
              cpu: "1"
              memory: 20Gi

    - name: plot-frame
      inputs:
        parameters:
          - name: filenumber
          - name: frame
          - name: tth
      script:
        image: ghcr.io/diamondlightsource/xrpd-toolbox:latest
        volumeMounts:
        - name: tmpdir
          mountPath: /tmp
        - name: session
          mountPath: "{{`{{ workflow.parameters.visitdir }}`}}"
        command: ["python"]
        source: |
          import os
          from pathlib import Path
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import numpy as np

          filenumber_str = "{{`{{ inputs.parameters.filenumber }}`}}"
          n = int("{{`{{ inputs.parameters.frame }}`}}")
          tth = float("{{`{{ inputs.parameters.tth }}`}}")

          beamline = "i15-1"
          visit_dir = "{{`{{ workflow.parameters.visitdir }}`}}"

          frame = np.load(f"/tmp/frames/frame_{n}.npy")

          tth_display = f"{tth:.3f}"
          tth_file = tth_display.replace(".", "_")
          output_filename = f"{beamline}-{filenumber_str}_tth_{tth_file}.png"
          artifact_path = f"/tmp/frames/frame_{n}.png"

          save_folder = Path(visit_dir) / "processed" / f"{beamline}-{filenumber_str}"
          save_folder.mkdir(parents=True, exist_ok=True)

          save_filepath = str(save_folder / output_filename)

          plt.figure()
          plt.imshow(frame)
          plt.colorbar()
          plt.title(f"{beamline}-{filenumber_str} tth={tth_display}")
          plt.savefig(artifact_path)
          plt.savefig(save_filepath)
          plt.close()
          print(f"Saved frame {n} (tth={tth_display}) to {save_filepath}")


      outputs:
        artifacts:
          - name: "plot-frames-{{`{{inputs.parameters.frame}}`}}"
            path: "/tmp/frames/frame_{{`{{inputs.parameters.frame}}`}}.png"
            archive:
              none: {}

    - name: workflow-entry
      dag:
        tasks:
        - name: sum-and-save-frames
          template: sum-and-save-frames
          dependencies: []
          arguments:
            parameters:
            - name: filenumber
              value: "{{`{{workflow.parameters.filenumber}}`}}"

        - name: plot-frame
          template: plot-frame
          dependencies: [sum-and-save-frames]
          arguments:
            parameters:
            - name: filenumber
              value: "{{`{{workflow.parameters.filenumber}}`}}"
            - name: frame
              value: "{{`{{item.index}}`}}"
            - name: tth
              value: "{{`{{item.tth}}`}}"
          withParam: "{{`{{tasks.sum-and-save-frames.outputs.parameters.frame-indices}}`}}"
