apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: i15-1-process-pdfs
  labels:
    workflows.diamond.ac.uk/science-group-crystallography: "true"
  annotations:
    workflows.argoproj.io/title: i15-1-process-pdfs
    workflows.argoproj.io/description: |
      Sends the already-reduced .xy file for each given filenumber to
      the containerised pdfgetx3 (pdfcurl), one filenumber at a time. 
      Filenumbers may be a single number, a comma-separated list, 
      a range (e.g. "12345-12349"), or a mix of these.
    workflows.diamond.ac.uk/repository: "https://github.com/DiamondLightSource/crystallography-workflows"
    workflows.diamond.ac.uk/parameter-schema.terminationfunctions: |
      {
        "type": "string",
        "oneOf": [
          { "const": "", "title": "None" },
          { "const": "lorch", "title": "lorch" },
          { "const": "step", "title": "step" }
        ],
        "default": ""
      }
    workflows.diamond.ac.uk/parameter-schema.publish: |
      {
        "type": "string",
        "enum": ["false", "true"],
        "default": "false",
        "description": "Also publish the resulting curves (iq/sq/fq/gr) to xrpddatavis for live plotting, in addition to returning them from pdfcurl."
      }
    workflows.diamond.ac.uk/ui-schema: |
      {
        "type": "VerticalLayout",
        "elements": [
          { "type": "Control", "scope": "#/properties/filenumbers" },
          { "type": "Control", "scope": "#/properties/visitdir" },
          { "type": "Control", "scope": "#/properties/qmaxinst" },
          { "type": "Control", "scope": "#/properties/qmin" },
          { "type": "Control", "scope": "#/properties/qmax" },
          { "type": "Control", "scope": "#/properties/rmin" },
          { "type": "Control", "scope": "#/properties/rmax" },
          { "type": "Control", "scope": "#/properties/rstep" },
          { "type": "Control", "scope": "#/properties/rpoly" },
          { "type": "Control", "scope": "#/properties/terminationfunctions" },
          { "type": "Control", "scope": "#/properties/twothetazero" },
          { "type": "Control", "scope": "#/properties/bgscale" },
          { "type": "Control", "scope": "#/properties/publish" }
        ]
      }
spec:
  entrypoint: workflow-entry
  arguments:
    parameters:
      - name: filenumbers
        value: "12345-12349"
      - name: visitdir
        valueFrom:
          configMapKeyRef:
            name: sessionspaces
            key: data_directory
      - name: qmaxinst
        value: "50.0"
      - name: qmin
        value: "0.5"
      - name: qmax
        value: "50.0"
      - name: rmin
        value: "0.0"
      - name: rmax
        value: "20.0"
      - name: rstep
        value: "0.02"
      - name: rpoly
        value: "0.9"
      - name: terminationfunctions
        value: ""
      - name: twothetazero
        value: "0"
      - name: bgscale
        value: "1.0"
      - name: publish
        value: "false"
  volumes:
  - name: session
    hostPath:
      path: "{{`{{ workflow.parameters.visitdir }}`}}"
      type: Directory
  - name: tmpdir
    emptyDir: {}
  templates:
    - name: i15-1-process-pdfs
      inputs:
        parameters:
          - name: filenumbers
          - name: qmaxinst
          - name: qmin
          - name: qmax
          - name: rmin
          - name: rmax
          - name: rstep
          - name: rpoly
          - name: terminationfunctions
          - name: twothetazero
          - name: bgscale
          - name: publish
      script:
        image: ghcr.io/diamondlightsource/xrpd-toolbox:latest
        volumeMounts:
        - name: tmpdir
          mountPath: /tmp
        - name: session
          mountPath: "{{`{{ workflow.parameters.visitdir }}`}}"
        command: ["python"]
        source: |

          from pathlib import Path

          from xrpd_toolbox.i15_1.eiger_500k import EigerDataLoader
          from xrpd_toolbox.i15_1.eiger_analysis import _get_background_xy_filepath
          from xrpd_toolbox.utils.pdfcurl import send_xy_to_pdfcurl

          filenumbers_str = "{{`{{ inputs.parameters.filenumbers }}`}}"
          visit_dir = "{{`{{ workflow.parameters.visitdir }}`}}"
          beamline = "i15-1"

          filenumber_values: list[int] = []
          for part in filenumbers_str.split(","):
              part = part.strip()
              if not part:
                  continue
              if "-" in part:
                  start_str, end_str = part.split("-", 1)
                  filenumber_values.extend(range(int(start_str), int(end_str) + 1))
              else:
                  filenumber_values.append(int(part))

          qmaxinst = float("{{`{{ inputs.parameters.qmaxinst }}`}}")
          qmin = float("{{`{{ inputs.parameters.qmin }}`}}")
          qmax = float("{{`{{ inputs.parameters.qmax }}`}}")
          rmin = float("{{`{{ inputs.parameters.rmin }}`}}")
          rmax = float("{{`{{ inputs.parameters.rmax }}`}}")
          rstep = float("{{`{{ inputs.parameters.rstep }}`}}")
          rpoly = float("{{`{{ inputs.parameters.rpoly }}`}}")
          terminationfunctions = "{{`{{ inputs.parameters.terminationfunctions }}`}}" or None
          twothetazero = float("{{`{{ inputs.parameters.twothetazero }}`}}")
          bgscale = float("{{`{{ inputs.parameters.bgscale }}`}}")
          publish = "{{`{{ inputs.parameters.publish }}`}}".lower() == "true"

          for filenumber in filenumber_values:
              output_name = f"{beamline}-{filenumber}"
              processed_dir = Path(visit_dir) / "processed" / output_name
              xy_filepaths = (
                  sorted(processed_dir.glob("*.xy")) if processed_dir.is_dir() else []
              )

              if not xy_filepaths:
                  print(f"No .xy file found for {output_name} in {processed_dir}, skipping")
                  continue

              nexus_filepath = Path(visit_dir) / f"{output_name}.nxs"
              eiger_data = EigerDataLoader(nexus_filepath)

              wavelength = eiger_data.get_wavelength()
              composition = eiger_data.get_composition()
              background_file = _get_background_xy_filepath(eiger_data)

              for xy_filepath in xy_filepaths:
                  try:
                      result = send_xy_to_pdfcurl(
                          xy_filepath=xy_filepath,
                          composition=composition,
                          wavelength=wavelength,
                          background_file=background_file,
                          qmaxinst=qmaxinst,
                          qmin=qmin,
                          qmax=qmax,
                          rmin=rmin,
                          rmax=rmax,
                          rstep=rstep,
                          rpoly=rpoly,
                          terminationfunctions=terminationfunctions,
                          twothetazero=twothetazero,
                          bgscale=bgscale,
                          publish=publish,
                      )
                      print(f"{xy_filepath}: {result}")
                  except Exception as e:
                      print(f"{xy_filepath}: failed to send to pdfcurl: {e}")

      podSpecPatch: |
        containers:
        - name: main
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 8Gi

    - name: workflow-entry
      dag:
        tasks:
        - name: i15-1-process-pdfs
          template: i15-1-process-pdfs
          dependencies: []
          arguments:
            parameters:
            - name: filenumbers
              value: "{{`{{workflow.parameters.filenumbers}}`}}"
            - name: qmaxinst
              value: "{{`{{workflow.parameters.qmaxinst}}`}}"
            - name: qmin
              value: "{{`{{workflow.parameters.qmin}}`}}"
            - name: qmax
              value: "{{`{{workflow.parameters.qmax}}`}}"
            - name: rmin
              value: "{{`{{workflow.parameters.rmin}}`}}"
            - name: rmax
              value: "{{`{{workflow.parameters.rmax}}`}}"
            - name: rstep
              value: "{{`{{workflow.parameters.rstep}}`}}"
            - name: rpoly
              value: "{{`{{workflow.parameters.rpoly}}`}}"
            - name: terminationfunctions
              value: "{{`{{workflow.parameters.terminationfunctions}}`}}"
            - name: twothetazero
              value: "{{`{{workflow.parameters.twothetazero}}`}}"
            - name: bgscale
              value: "{{`{{workflow.parameters.bgscale}}`}}"
            - name: publish
              value: "{{`{{workflow.parameters.publish}}`}}"
