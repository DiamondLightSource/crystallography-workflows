apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: i15-1-eiger-analysis
  labels:
    workflows.diamond.ac.uk/science-group-crystallography: "true"
  annotations:
    workflows.argoproj.io/title: i15-1-eiger-analysis
    workflows.argoproj.io/description: |
      This takes a nxs filenumber and runs the processing required for the type of scan. 
      This should be done at the end of every scan.
    workflows.diamond.ac.uk/repository: "https://github.com/DiamondLightSource/crystallography-workflows"
spec:
  entrypoint: workflow-entry
  arguments:
    parameters:
      - name: filenumber
        value: "12345"
      - name: visitdir
        valueFrom:
          configMapKeyRef:
            name: sessionspaces
            key: data_directory
  volumes:
  - name: session
    hostPath:
      path: "{{`{{ workflow.parameters.visitdir }}`}}"
      type: Directory
  volumeClaimTemplates:
  - metadata:
      name: tmpdir
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
      storageClassName: netapp
  templates:
    - name: i15-1-eiger-analysis
      inputs:
        parameters:
          - name: filenumber
      script:
        image: ghcr.io/diamondlightsource/xrpd-toolbox:latest
        volumeMounts:
        - name: tmpdir
          mountPath: /tmp
        - name: session
          mountPath: "{{`{{ workflow.parameters.visitdir }}`}}"
        command: ["python"]
        env:
          - name: MKL_NUM_THREADS
            value: "1"
          - name: NUMEXPR_NUM_THREADS
            value: "1"
          - name: OMP_NUM_THREADS
            value: "1"
        source: |

          import json
          import os
          import shutil

          from xrpd_toolbox.i15_1.eiger_analysis import run_eiger_analysis
          from pathlib import Path

          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import numpy as np

          filenumber_str = str("{{`{{ inputs.parameters.filenumber }}`}}")
          visit_dir = "{{`{{ workflow.parameters.visitdir }}`}}"

          beamline = "i15-1"
          filename = beamline + "-" + filenumber_str + ".nxs"

          nexus_filepath = Path(visit_dir) / filename

          output_xy = run_eiger_analysis(nexus_filepath=str(nexus_filepath))

          output_name = beamline + "-" + filenumber_str

          xy_items = []

          if isinstance(output_xy, Path):
              xy_artifact_path = f"/tmp/{output_name}.xy"
              shutil.copy(str(output_xy), xy_artifact_path)

              try:
                two_theta, intensity = np.loadtxt(str(output_xy), unpack=True)

                artifact_path = f"/tmp/{output_name}.png"
                plt.figure()
                plt.plot(two_theta, intensity)
                plt.xlabel("2theta (deg)")
                plt.ylabel("Intensity (Arb. Units)")
                plt.title(output_name)
                plt.savefig(artifact_path)
                plt.close()
              except Exception as e:
                print(f"output_xy is not xy? :, {e} skipping plot")

          elif isinstance(output_xy, list):
              # move xy files to the shared tmp volume so that a separate
              # plot-eiger-xy task can be fanned out per file, each
              # producing its own individual artifacts
              xy_dir = "/tmp/xy_files"
              os.makedirs(xy_dir, exist_ok=True)
              for idx, src_path in enumerate(output_xy):
                  xy_filename = f"{output_name}_{idx}.xy"
                  plot_filename = f"{output_name}_{idx}.png"
                  shutil.copy(str(src_path), os.path.join(xy_dir, xy_filename))
                  xy_items.append(
                      {"index": idx, "xy_filename": xy_filename, "plot_filename": plot_filename}
                  )

          else:
              print("output_xy is None, skipping plot")

          with open("/tmp/eiger-xy-items.json", "w") as f:
              json.dump(xy_items, f)


      outputs:
        parameters:
          - name: eiger-xy-items
            valueFrom:
              path: /tmp/eiger-xy-items.json
        artifacts:
          - name: eiger-analysis-plot
            path: "/tmp/i15-1-{{`{{inputs.parameters.filenumber}}`}}.png"
            optional: true
            archive:
              none: {}
          - name: eiger-analysis-xy
            path: "/tmp/i15-1-{{`{{inputs.parameters.filenumber}}`}}.xy"
            optional: true
            archive:
              none: {}

      podSpecPatch: |
        containers:
        - name: main
          resources:
            requests:
              cpu: "1"
              memory: 10Gi
            limits:
              cpu: "1"
              memory: 20Gi

    - name: plot-eiger-xy
      inputs:
        parameters:
          - name: index
          - name: xy_filename
          - name: plot_filename
      script:
        image: ghcr.io/diamondlightsource/xrpd-toolbox:latest
        volumeMounts:
        - name: tmpdir
          mountPath: /tmp
        command: ["python"]
        source: |

          from pathlib import Path

          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import numpy as np

          xy_filename = "{{`{{ inputs.parameters.xy_filename }}`}}"
          plot_filename = "{{`{{ inputs.parameters.plot_filename }}`}}"

          xy_path = Path("/tmp/xy_files") / xy_filename
          plot_path = Path("/tmp/xy_files") / plot_filename

          try:
              two_theta, intensity = np.loadtxt(str(xy_path), unpack=True)

              plt.figure()
              plt.plot(two_theta, intensity)
              plt.xlabel("2theta (deg)")
              plt.ylabel("Intensity (Arb. Units)")
              plt.title(xy_path.stem)
              plt.savefig(str(plot_path))
              plt.close()
          except Exception as e:
              print(f"{xy_filename} is not xy? :, {e} skipping plot")

      outputs:
        artifacts:
          - name: "eiger-analysis-xy-{{`{{inputs.parameters.index}}`}}"
            path: "/tmp/xy_files/{{`{{inputs.parameters.xy_filename}}`}}"
            archive:
              none: {}
          - name: "eiger-analysis-plot-{{`{{inputs.parameters.index}}`}}"
            path: "/tmp/xy_files/{{`{{inputs.parameters.plot_filename}}`}}"
            optional: true
            archive:
              none: {}

    - name: workflow-entry
      dag:
        tasks:
        - name: i15-1-eiger-analysis
          template: i15-1-eiger-analysis
          dependencies: []
          arguments:
            parameters:
            - name: filenumber
              value: "{{`{{workflow.parameters.filenumber}}`}}"

        - name: plot-eiger-xy
          template: plot-eiger-xy
          dependencies: [i15-1-eiger-analysis]
          arguments:
            parameters:
            - name: index
              value: "{{`{{item.index}}`}}"
            - name: xy_filename
              value: "{{`{{item.xy_filename}}`}}"
            - name: plot_filename
              value: "{{`{{item.plot_filename}}`}}"
          withParam: "{{`{{tasks.i15-1-eiger-analysis.outputs.parameters.eiger-xy-items}}`}}"
